<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3a1f4d"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><title>حسابداری قرض‌ها</title>
<style>
:root{--chrome:#3a1f4d;--chrome2:#54316b;--bg:#ece8f1;--card:#fff;--txt:#2a2032;--mut:#7b6e87;--acc:#c2561a;--line:#ddd5e6;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1524;--card:#2a2034;--txt:#f1ebf6;--mut:#b2a4bf;--line:#43344f;--ok:#6fd09a;--acc:#ee8247}}
:root[data-theme="dark"]{--bg:#1d1524;--card:#2a2034;--txt:#f1ebf6;--mut:#b2a4bf;--line:#43344f;--ok:#6fd09a;--acc:#ee8247}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 Tahoma,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
nav{background:var(--chrome);color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px;flex-wrap:wrap}
nav b{font-size:17px;margin-inline-end:18px;padding:12px 0}
nav button{background:none;border:0;color:#d9c9e6;padding:14px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--acc)}
main{flex:1;min-height:0;display:flex}
.pane{display:none;flex:1;min-height:0}.pane.on{display:flex}
#list{width:320px;max-width:42%;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
.top{padding:12px;display:flex;gap:8px;flex-direction:column}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.g{background:none;color:var(--txt);border:1px solid var(--line)}.btn.r{background:none;color:#c0392b;border:1px solid #c0392b}
#people{overflow:auto;flex:1}
.row{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.row.on{background:var(--bg);box-shadow:inset 4px 0 0 var(--acc)}[dir=rtl] .row.on{box-shadow:inset -4px 0 0 var(--acc)}
.row small{color:var(--mut);display:block}
.chip{background:var(--bg);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--ok);white-space:nowrap}.chip.d{color:var(--acc);background:rgba(194,86,26,.12)}
#prof,.wrap{flex:1;overflow:auto;padding:18px;background:var(--bg)}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{width:46px;height:46px;border-radius:50%;background:var(--chrome2);color:#fff;display:grid;place-items:center;font-size:20px}
.head h2{margin:0;font-size:19px}.head p{margin:0;color:var(--mut)}.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:12px;padding:12px}.stats span{color:var(--mut);font-size:12px;display:block}.stats b{font-size:18px}.stats .a b{color:var(--acc)}
.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:8px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:normal;font-size:12px}
td input{padding:5px 7px;width:100px}
.empty{color:var(--mut);text-align:center;padding:40px}
dialog{border:0;border-radius:12px;padding:18px;background:var(--card);color:var(--txt);width:min(360px,92vw)}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
@media(max-width:700px){main{flex-direction:column}.pane{min-width:0}#p_debts{flex-direction:column}#prof{min-height:0}#list{width:100%;max-width:none;max-height:38%}.add{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  body{font-size:14px}nav{padding:5px 8px;gap:2px}nav b{width:100%;padding:4px 6px;margin:0}
  nav button{padding:10px 9px}#list{max-height:36%;min-height:135px}
  #prof,.wrap{padding:10px}.card{padding:12px}.add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .add input:first-child,.add button{grid-column:1/-1}input,select,button{min-height:42px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .stats b{font-size:16px;overflow-wrap:anywhere}
}
</style>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="cloud.css">
</head>
<body>
<div id="auth-root" class="auth-stage"></div>
<div id="app-shell" hidden inert>
<nav><b id="t_app"></b><button data-tab="debts" id="t_debts"></button><button data-tab="report" id="t_report"></button><button data-tab="settings" id="t_settings"></button><div class="admin-actions"><span id="admin-name"></span><button type="button" id="admin-settings"></button><button type="button" id="admin-logout"></button></div></nav>
<main>
<section class="pane on" id="p_debts">
 <div id="list"><div class="top"><input id="q"><button class="btn" id="newP"></button></div><div id="people"></div></div>
 <div id="prof"></div>
</section>
<section class="pane" id="p_report"><div class="wrap" id="rep"></div></section>
<section class="pane" id="p_settings"><div class="wrap" id="set"></div></section>
</main>
<dialog id="dlg"><h3 id="dt" style="margin:0 0 6px"></h3><label id="l_name"></label><input id="f_name"><label id="l_phone"></label><input id="f_phone" inputmode="tel"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="ok"></button><button class="btn g" id="no"></button></div></dialog>
</div>
<script src="auth-core.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
